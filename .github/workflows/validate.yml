name: Validate Google Play Deployment Assistant

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apppublisher-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, type-check, runtime-test and build
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run check

      - name: Download pinned APK fixture
        shell: bash
        run: |
          mkdir -p .tmp
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/QuoInsight/minimal.apk/585bdb53eb7b8501177ffd7c57ea57d4ec1002af/releases/2.00/quoinsight.apk" \
            --output .tmp/quoinsight-2.00.apk
          test "$(wc -c < .tmp/quoinsight-2.00.apk)" -gt 1000000

      - name: Runtime-smoke real APK parser
        run: node scripts/smoke-apk-parser.mjs .tmp/quoinsight-2.00.apk

      - name: Production build
        run: npm run build
