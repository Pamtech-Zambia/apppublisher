name: Validate Google Play Deployment Assistant

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apppublisher-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Install, type-check and build
    runs-on: [self-hosted, KASAINSTITUTE]
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run check

      - name: Production build
        run: npm run build
