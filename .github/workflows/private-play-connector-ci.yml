name: Universal Play Publisher Connector Tests
on:
  push:
    paths:
      - 'private-connector/universal/**'
      - '.github/workflows/private-play-connector-ci.yml'
  pull_request:
    paths:
      - 'private-connector/universal/**'
      - '.github/workflows/private-play-connector-ci.yml'
permissions:
  contents: read
jobs:
  universal-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out reviewed code
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r private-connector/universal/requirements.txt pytest
      - name: Compile the private connector
        run: python -m compileall -q private-connector/universal
      - name: Test OAuth, tenant isolation and release guards
        working-directory: private-connector/universal
        run: python -m pytest -q tests/test_universal.py
